# One-click release: Actions → release → Run workflow.
# Sets the version in package.json, commits it, tags it, creates the GitHub release
# and attaches the module package (vitrine-x.y.z.tgz) to import in Companion.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version, e.g. 0.2.0 (leave empty to use the choice above)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Version, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          if [ -n "$EXACT" ]; then
            npm version "${EXACT#v}" --no-git-tag-version --allow-same-version
          else
            npm version "$BUMP" --no-git-tag-version
          fi
          next="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists"; exit 1
          fi
          npm run package
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Release $next" || true
          git tag -a "$next" -m "Vitrine Companion module $next"
          git push origin HEAD:main "$next"
          gh release create "$next" --title "$next" --generate-notes --verify-tag ./*.tgz
